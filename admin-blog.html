<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog | Good Girls Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="images/logo.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .blog-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
    .blog-toolbar .count{font-size:.78rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)}
    .post-list{display:grid;gap:14px}
    .post-row{display:grid;grid-template-columns:90px 1fr auto;gap:18px;align-items:center;background:var(--dark-card);border:1px solid var(--border-gold);border-radius:4px;padding:14px 18px}
    .post-row img{width:90px;height:60px;object-fit:cover;border-radius:3px;border:1px solid var(--border-gold);background:#000}
    .post-row .noimg{width:90px;height:60px;border-radius:3px;border:1px dashed var(--border-gold);display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase}
    .post-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-style:italic;color:var(--white);line-height:1.2}
    .post-meta{font-size:.76rem;color:var(--text-muted);margin-top:4px}
    .badge{display:inline-block;font-size:.62rem;letter-spacing:1.4px;text-transform:uppercase;padding:3px 9px;border-radius:2px;margin-left:8px;vertical-align:middle;font-style:normal;font-family:'Inter',sans-serif}
    .badge.pub{background:rgba(143,191,122,.15);color:var(--success);border:1px solid rgba(143,191,122,.35)}
    .badge.draft{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid var(--border-gold)}
    .row-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .row-actions .btn-outline,.row-actions button.btn-outline{padding:8px 14px;font-size:.68rem}
    .row-actions .danger:hover{background:var(--error);border-color:var(--error);color:var(--white)}
    .empty-box{text-align:center;color:var(--text-muted);padding:50px 20px;border:1px dashed var(--border-gold);border-radius:4px}
    @media(max-width:620px){.post-row{grid-template-columns:70px 1fr}.post-row img,.post-row .noimg{width:70px;height:50px}.row-actions{grid-column:1/-1;justify-content:flex-start}}
  </style>
</head>
<body>

  <div class="admin-topbar">
    <div class="admin-topbar-inner">
      <a href="index.html" class="admin-brand"><img src="images/logo.jpg" alt="Good Girls" />Good <span>Girls</span></a>
      <div class="admin-topbar-actions">
        <a href="admin-dashboard.html" class="btn-outline">&larr; Dashboard</a>
        <span class="admin-user" id="userEmail"></span>
        <button class="btn-outline" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>
  </div>

  <main class="admin-main">
    <div class="admin-header">
      <p class="eyebrow">Blog</p>
      <h1>Your <em>articles</em></h1>
      <p>Write new articles, edit existing ones, or take them offline. Published articles appear on the Blog page automatically.</p>
    </div>

    <div class="message" id="message"></div>

    <div class="blog-toolbar">
      <span class="count" id="count"></span>
      <a class="btn" href="admin-blog-editor.html">+ New article</a>
    </div>

    <div id="loadingState" class="loading-state">Loading&hellip;</div>
    <div id="list" class="post-list" hidden></div>
    <div id="emptyState" class="empty-box" hidden>No articles yet. Press <b>+ New article</b> to write your first one.</div>

    <div class="dash-links" style="margin-top:36px">
      <a href="blog.html" target="_blank" rel="noopener">View Blog page &rarr;</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/blog-common.js"></script>
  <script src="js/admin-blog.js"></script>
</body>
</html>
