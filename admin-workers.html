<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workers &amp; Profiles | Good Girls Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="images/logo.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/workers.css" />
</head>
<body>

  <div class="admin-topbar">
    <div class="admin-topbar-inner">
      <a href="index.html" class="admin-brand"><img src="images/logo.jpg" alt="Good Girls" />Good <span>Girls</span></a>
      <div class="admin-topbar-actions">
        <a href="admin-dashboard.html" class="btn-outline">&larr; Dashboard</a>
        <span class="admin-user" id="userEmail"></span>
        <button class="btn-outline" id="logoutBtn" type="button">Logout</button>
      </div>
    </div>
  </div>

  <main class="admin-main">
    <div class="admin-header">
      <p class="eyebrow">Workers &amp; Profiles</p>
      <h1>Manage your <em>girls</em></h1>
      <p>Add a new worker, then add her photos and videos. Use the arrows to choose the order they appear on your Meet the Girls page.</p>
    </div>

    <div class="message" id="message"></div>

    <div class="wk-toolbar">
      <button class="btn" id="addBtn" type="button">+ Add new worker</button>
    </div>

    <div id="loadingState" class="loading-state">Loading&hellip;</div>
    <div id="list" class="wk-list" hidden></div>
    <div id="emptyState" class="wk-empty-box" hidden>
      No workers yet. Press <b>+ Add new worker</b> to create the first profile.
    </div>

    <div class="dash-links" style="margin-top:36px">
      <a href="meet-the-girls.html" target="_blank" rel="noopener">View Meet the Girls page &rarr;</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="js/admin-workers.js"></script>
</body>
</html>
