<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Availability | Admin | Good Girls</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" href="images/logo.jpg" type="image/jpeg" />
  <link rel="apple-touch-icon" href="images/logo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --dark: #0a0e1a;
      --dark-alt: #141824;
      --dark-card: rgba(20, 24, 36, 0.6);
      --gold: #c9a84c;
      --gold-light: #d4b85c;
      --white: #ffffff;
      --text-light: #e8e8e8;
      --text-muted: #9a9a9a;
      --border-gold: rgba(201, 168, 76, 0.2);
      --border-gold-hover: rgba(201, 168, 76, 0.5);
      --error: #d47a7a;
      --success: #8fbf7a;
      --amber: #d4b85c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--text-light);
      line-height: 1.6;
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at top, rgba(201, 168, 76, 0.06) 0%, transparent 60%),
        radial-gradient(ellipse at bottom, rgba(201, 168, 76, 0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ---------- TOP BAR ---------- */
    .admin-topbar {
      position: relative;
      z-index: 2;
      background: rgba(10, 14, 26, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-gold);
      padding: 16px 0;
    }

    .admin-topbar-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: var(--white);
      text-decoration: none;
    }

    .admin-brand img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(201, 168, 76, 0.3);
    }

    .admin-brand span { color: var(--gold); }

    .admin-topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-user {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .btn-outline {
      display: inline-block;
      padding: 10px 22px;
      border-radius: 2px;
      font-weight: 500;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(201, 168, 76, 0.4);
      background: transparent;
      color: var(--gold);
      text-decoration: none;
      font-family: 'Inter', sans-serif;
    }

    .btn-outline:hover {
      background: var(--gold);
      color: var(--dark);
      border-color: var(--gold);
    }

    /* ---------- MAIN ---------- */
    .admin-main {
      position: relative;
      z-index: 2;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .admin-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 0.7rem;
      color: var(--gold);
      font-weight: 500;
      margin-bottom: 12px;
      display: block;
    }

    .admin-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-style: italic;
      color: var(--white);
      font-weight: 400;
      margin-bottom: 8px;
    }

    .admin-header h1 em { color: var(--gold); font-style: normal; }

    .admin-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ---------- MESSAGE ---------- */
    .message {
      display: none;
      padding: 14px 20px;
      border-radius: 2px;
      font-size: 0.9rem;
      margin-bottom: 24px;
      text-align: center;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .message.show { display: block; }

    .message.error {
      background: rgba(212, 122, 122, 0.1);
      border: 1px solid rgba(212, 122, 122, 0.35);
      color: var(--error);
    }

    .message.success {
      background: rgba(143, 191, 122, 0.1);
      border: 1px solid rgba(143, 191, 122, 0.35);
      color: var(--success);
    }

    /* ---------- DAYS LIST ---------- */
    .days-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 32px;
    }

    .day-row {
      display: grid;
      grid-template-columns: 140px 1fr 1fr 1fr 1.4fr;
      gap: 16px;
      align-items: center;
      background: var(--dark-card);
      border: 1px solid var(--border-gold);
      border-radius: 4px;
      padding: 20px 24px;
      transition: all 0.3s ease;
    }

    .day-row:hover {
      border-color: var(--border-gold-hover);
    }

    .day-row .day-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      font-style: italic;
      color: var(--white);
      letter-spacing: 0.5px;
    }

    .day-row select,
    .day-row input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid rgba(201, 168, 76, 0.25);
      border-radius: 2px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      transition: all 0.3s;
      background: rgba(10, 14, 26, 0.6);
      color: var(--text-light);
    }

    .day-row select:focus,
    .day-row input:focus {
      outline: none;
      border-color: var(--gold);
      background: rgba(10, 14, 26, 0.9);
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
    }

    .day-row input::placeholder {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .day-row input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .field-label {
      display: block;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    /* ---------- SAVE BAR ---------- */
    .save-bar {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 24px 0;
      position: sticky;
      bottom: 0;
      background: linear-gradient(to top, rgba(10, 14, 26, 0.98) 70%, transparent);
      margin-top: 24px;
      padding-top: 40px;
      z-index: 5;
    }

    .btn {
      display: inline-block;
      padding: 15px 40px;
      border-radius: 2px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--dark);
      font-family: 'Inter', sans-serif;
    }

    .btn:hover {
      background: transparent;
      color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(201, 168, 76, 0.2);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-light);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-secondary:hover {
      background: var(--white);
      color: var(--dark);
      border-color: var(--white);
    }

    /* ---------- LOADING ---------- */
    .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ---------- PREVIEW LINK ---------- */
    .preview-link {
      text-align: center;
      margin-top: 24px;
    }

    .preview-link a {
      color: var(--gold);
      font-size: 0.85rem;
      text-decoration: none;
      transition: 0.3s;
    }

    .preview-link a:hover {
      text-decoration: underline;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 900px) {
      .day-row {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .day-row .day-name {
        grid-column: 1 / -1;
        font-size: 1.15rem;
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(201, 168, 76, 0.1);
      }
    }

    @media (max-width: 560px) {
      .admin-topbar-inner {
        justify-content: center;
        text-align: center;
      }
      .admin-user { display: none; }
      .day-row {
        grid-template-columns: 1fr;
      }
      .save-bar {
        flex-direction: column;
        align-items: center;
      }
      .save-bar .btn {
        width: 100%;
        max-width: 320px;
      }
    }
  </style>
</head>
<body>

  <!-- ========== TOP BAR ========== -->
  <div class="admin-topbar">
    <div class="admin-topbar-inner">
      <a href="index.html" class="admin-brand">
        <img src="images/logo.jpg" alt="Good Girls" />
        Good <span>Girls</span>
      </a>
      <div class="admin-topbar-actions">
        <a href="admin-dashboard.html" class="btn-outline">&larr; Dashboard</a>
        <span class="admin-user" id="userEmail"></span>
        <button class="btn-outline" id="logoutBtn">Logout</button>
      </div>
    </div>
  </div>

  <!-- ========== MAIN ========== -->
  <main class="admin-main">

    <div class="admin-header">
      <p class="eyebrow">Admin Panel</p>
      <h1>Weekly <em>Availability</em></h1>
      <p>Edit Missy's availability below. Changes go live on the public availability page as soon as you save.</p>
    </div>

    <div class="message" id="message"></div>

    <div id="loadingState" class="loading-state">Loading availability…</div>

    <form id="availabilityForm" style="display: none;">
      <div class="days-grid" id="daysGrid"></div>

      <div class="save-bar">
        <button type="submit" class="btn" id="saveBtn">Save Changes</button>
        <button type="button" class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
    </form>

    <div class="preview-link">
      <a href="missy-availability.html" target="_blank" rel="noopener">View public availability page →</a>
    </div>

  </main>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase config -->
  <script src="supabase-config.js"></script>

  <!-- Admin logic -->
  <script src="js/admin.js"></script>

</body>
</html>
